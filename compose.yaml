services:
  calma-bot:
    build:
      context: .
    image: calma-superbot:local
    container_name: calma-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - calma_bot_data:/data
      - ${ARCA_SECRETS_DIR:-/home/nicolas/.config/calma/arca}:/run/arca:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  calma_bot_data:
